<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rajthari Village</title>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7f5;
      color: #222;
    }

    header {
      background: #176b3a;
      color: white;
      text-align: center;
      padding: 24px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 29px;
    }

    header p {
      margin: 8px 0 0;
    }

    nav {
      background: white;
      padding: 10px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
    }

    nav a {
      display: inline-block;
      margin: 5px 7px;
      text-decoration: none;
      color: #176b3a;
      font-weight: bold;
    }

    .hero {
      text-align: center;
      padding: 45px 18px;
      background: #e7f4ea;
    }

    .hero h2 {
      margin: 0 0 10px;
      font-size: 32px;
    }

    .hero p {
      font-size: 17px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 25px 15px;
    }

    .section-title {
      text-align: center;
      margin-bottom: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,.08);
    }

    .card h3 {
      color: #176b3a;
      margin-top: 0;
    }

    .notice {
      background: white;
      padding: 18px;
      border-radius: 10px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .notice h3 {
      margin-top: 0;
      color: #176b3a;
    }

    .button {
      display: inline-block;
      border: 0;
      background: #176b3a;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      margin: 5px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
    }

    .button:hover {
      opacity: .9;
    }

    .full-button {
      width: 100%;
      margin: 15px 0 0;
    }

    .delete-button {
      background: #b3261e;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }

    .login-box {
      width: 92%;
      max-width: 400px;
      margin: 30px auto;
      padding: 22px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,.1);
    }

    .login-box h2,
    .login-box h3 {
      text-align: center;
      color: #176b3a;
    }

    label {
      display: block;
      margin-top: 13px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    #adminPanel {
      display: none;
      width: 92%;
      max-width: 850px;
      margin: 25px auto;
      padding: 25px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,.1);
    }

    #adminPanel h2 {
      text-align: center;
      color: #176b3a;
    }

    #messageBox {
      text-align: center;
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <h1>Rajthari Village</h1>
    <p>Welcome to our community portal</p>
  </header>

  <nav>
    <a href="#hero">Home</a>
    <a href="#notices">Notices</a>
    <a href="#adminPanel">Admin</a>
  </nav>

  <section id="hero" class="hero">
    <h2>Welcome to Rajthari</h2>
    <p>Stay updated with the latest news, notices, and village information.</p>
  </section>

  <div class="container">
    <h2 class="section-title" id="notices">Notice Board</h2>
    <div id="noticeBoard">
      <p>Loading notices...</p>
    </div>

    <div id="messageBox"></div>

    <!-- ADMIN PANEL -->
    <div id="adminPanel">
      <h2>Admin Panel</h2>
      <label for="noticeTitle">Notice Title</label>
      <input type="text" id="noticeTitle" placeholder="Enter title">

      <label for="noticeMessage">Notice Content</label>
      <textarea id="noticeMessage" placeholder="Enter message body"></textarea>

      <button id="addNoticeButton" type="button" class="button full-button">Publish Notice</button>
    </div>
  </div>

  <script>
    // Initialize Supabase Client with your Publishable Key
    const SUPABASE_URL = "https://YOUR_SUPABASE_PROJECT_ID.supabase.co"; // Replace with your Supabase Project URL
    const SUPABASE_KEY = "Sb_publishable_aptzw3bdHRossoUktQ5Pgg_oLKbq2N_";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let currentProfile = null;

    function showMessage(msg) {
      const msgBox = document.getElementById("messageBox");
      if (msgBox) msgBox.textContent = msg;
    }

    /* =====================================================
       LOAD NOTICES
       ===================================================== */
    async function loadNotices() {
      const board = document.getElementById("noticeBoard");
      board.innerHTML = "";

      const result = await supabaseClient
        .from("notices")
        .select("*")
        .order("created_at", { ascending: false });

      if (result.error || !result.data || result.data.length === 0) {
        board.innerHTML = "<p>📢 No notices available.</p>";
        return;
      }

      result.data.forEach(function(notice) {
        const box = document.createElement("div");
        box.className = "notice";

        const title = document.createElement("h3");
        title.textContent = "📢 " + (notice.title || "Notice");

        const message = document.createElement("p");
        message.textContent = notice.message || "";

        box.appendChild(title);
        box.appendChild(message);

        if (currentProfile && currentProfile.role === "admin") {
          const deleteButton = document.createElement("button");
          deleteButton.type = "button";
          deleteButton.className = "delete-button";
          deleteButton.textContent = "🗑️ Delete Notice";

          deleteButton.addEventListener("click", function() {
            deleteNotice(notice.id);
          });

          box.appendChild(deleteButton);
        }

        board.appendChild(box);
      });
    }

    /* =====================================================
       DELETE NOTICE
       ===================================================== */
    async function deleteNotice(id) {
      const result = await supabaseClient
        .from("notices")
        .delete()
        .eq("id", id);

      if (result.error) {
        showMessage("❌ " + result.error.message);
        return;
      }

      showMessage("✅ Notice deleted successfully!");
      await loadNotices();
    }

    /* =====================================================
       ADD NOTICE
       ===================================================== */
    document.getElementById("addNoticeButton").addEventListener("click", async function() {
      if (!currentUser || !currentProfile || currentProfile.role !== "admin") {
        showMessage("❌ Admin access required.");
        return;
      }

      const title = document.getElementById("noticeTitle").value.trim();
      const message = document.getElementById("noticeMessage").value.trim();

      if (!title || !message) {
        showMessage("⚠️ Enter notice title and message.");
        return;
      }

      const result = await supabaseClient
        .from("notices")
        .insert({
          title: title,
          message: message,
          created_by: currentUser.id
        });

      if (result.error) {
        showMessage("❌ " + result.error.message);
        return;
      }

      document.getElementById("noticeTitle").value = "";
      document.getElementById("noticeMessage").value = "";
      showMessage("✅ Notice published!");

      await loadNotices();
    });

    // Initial Load
    window.addEventListener("DOMContentLoaded", () => {
      loadNotices();
    });
  </script>
</body>
</html>
